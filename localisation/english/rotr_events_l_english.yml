 answering_the_succsession_issue.1.a: "In An Act Of Genius The King Chooses His Brother John As His Heir."
 answering_the_succsession_issue.1.b: "In An Act Of Confusion The King Chooses To Split The Kingdom Of Aragon Between John And Ferdinand."
 answering_the_succsession_issue.1.c: "In An Act Of Favoritism The King Chooses His Illegitimate Son Ferdinand As His Heir."
 answering_the_succsession_issue.1.d: "One Day After Some Back And Forth Between John And Ferdinand They Decide That They Have Enough.\nSo Later In King Alfonso V Court They Both Confront Him And Demand He Ends The Succsession Problem Right Now.\nSo Then John And Ferdinand Argue And After Some Back And Forth The King Says Enough Of This Bickering I Shall Settle This Right Now.\nThe Person I Choose As My Heir Shall Be..."
 answering_the_succsession_issue.1.t: "Answering The Succsession Issue"

 england_surrenders_normandy.1.a: "We Have No Choice But To Accept"
 england_surrenders_normandy.1.d: "After Years Of English Rule The English Have Lost Normandy After The Duke Of Sommerset Surrendered The Province.\nThis Has Secured A Peace Between The 2 Powers And Is A Massive Blow To English Power As Frances Rise Continues."
 england_surrenders_normandy.1.t: "England Surrenders Normandy"

 the_succession_answer.1.a: "In An Act Of Logic The King Chooses John As His Heir"
 the_succession_answer.1.b: "In An Act Of Confusion The King Chooses To Split The Kingom Of Aragon Between Them"
 the_succession_answer.1.c: "In An Act Of Favoritism The King Chooses Ferdinand As His Heir"
 the_succession_answer.1.d: "King Alfonso V Must Figure Something Out Between His Brother John And His Illegitimate Son.\nOne Day Both John And Ferdinand Enter King Alfonso V Court And Naples And They Both Demand The Throne From One Another.\nAnd After Some Arguing King Alfonso V Says Enough Of This I Will Seddle This Right Now I Choose..."
 the_succession_answer.1.t: "The Succession Answer"

