l_english:
 a_split_succsession: "A Split Succsession"
 a_split_succsession_desc: "The King Has Chosen To Split The Inheretince In 2.\nJohn Shall Gain Aragon,Sardinia,And Sicily.\nWhile Ferdinand Shall Keep Mainland Naples."
 dismiss_queen_margaret_from_court: "Dismiss Queen Margaret From Court"
 dismiss_queen_margaret_from_court_desc: "Now That York Is Advisor Over Sommerset The 1st Thing He Must Do Is Convince King Henry VI To Dismiss Queen Margaret.\nSo That Way That French Spy Can Stop Telling The King Poisonous Ideas That Will Bring England To Ruin."
 fight_for_normandy: "Fight For Normandy"
 fight_for_normandy_desc: "Now That Margaret Is Away From Court We Shall Now Fight For Normandy.\nUnlike That Coward Sommerset Who Wants To Give Away Land We Fought For."
 rise_of_the_renaissance_new_focus_tree_2_focus_1: "A Crumbling Empire"
 rise_of_the_renaissance_new_focus_tree_2_focus_1_desc: "The Empire Is In Ruin The Ottomans Have Seized Almost all Our Lands And Our Economy Is In Ruins Aswell.\nAnd Our Army Is Disorganized And Weak We Must Find A Way To Fix This."
 rise_of_the_renaissance_new_focus_tree_focus_10: "Calvary Reforms"
 rise_of_the_renaissance_new_focus_tree_focus_10_desc: "Describe this focus."
 rise_of_the_renaissance_new_focus_tree_focus_7: "Rebuilding the English Army"
 rise_of_the_renaissance_new_focus_tree_focus_7_desc: "The English Army Is Exshausted From The War With France.\nAnd We Need To Begin Army Refroms Right Now."
 rise_of_the_renaissance_new_focus_tree_focus_8: "Infantry Reforms"
 rise_of_the_renaissance_new_focus_tree_focus_8_desc: "Describe this focus."
 rise_of_the_renaissance_new_focus_tree_focus_9: "Enter The Age Of Gunpowder"
 rise_of_the_renaissance_new_focus_tree_focus_9_desc: "1 Thing We Have Learned Is That Gunpowder Is The Future Of War.\nAnd If We Want To Recover Our Strengh We Need To Work With Guns."
 surrender_normandy: "Surrender Normandy"
 surrender_normandy_desc: "In Order To Secure Peace With France Is To Give Normandy Back To France.\nIn Exchange Fore Calais And Gascony But If York Finds Out He May Return From Ireland In Outrage."
 the_conquest_of_naples: "The Conquest Of Naples"
 the_conquest_of_naples_desc: "In 1442 King Alfonso Brought Naples Into Aragon.\nAnd The Peoples Of Aragon And Naples Are Now Unified Under Him."
 the_fighting_factions: "The Fighting Factions"
 the_fighting_factions_desc: "Currently There Are 2 Faction Fighting For Power.\nThe House Of Lancaster Who Wants To End The War For France Led By The Duke Of Sommerset And Queen Margaret . \nAnd The House Of York Lead By The Duke Of York Whom Is Currently In Ireland And Wants To Continue The War With France.\nAnd Is The Heir To The Throne. But Henry Must Pick A Side Or Else Internal Conflict Will Continue."
 the_house_of_lancaster: "The House Of Lancaster"
 the_house_of_lancaster_desc: "York Is A fool To Think We Should Trust Him We Shall Keep Trusting Sommerset To Advise The King. "
 the_house_of_york: "The House Of York"
 the_house_of_york_desc: "Sommerset Is Starting To Become Unloyal According To The King So He Shall Replace Sommerset And Have York As His Main Advisor.\nMuch To The Dismay Of Queen Margaret."
 the_king_chooses_ferdinand: "The King Chooses Ferdinand"
 the_king_chooses_ferdinand_desc: "The King Has Chose His Favorite Son Ferdinand As His Heir Despite Being Illegitimate.\nFerdinand Must Walk A Tight Rope Now Because To The People Of Aragon.\nHe Is Nothing More Than A Illegitimate Pretender"
 the_king_chooses_john: "The King Chooses John"
 the_king_chooses_john_desc: "The King Has Chosen His Legitimate Brother John.\nSo Ferdinand Shall Inherit Nothing But Ferdinand is Popular In Naples.\nSo His Supporters Might Revolt In OutRAGE."
 the_question_of_succession: "The Question Of Succession"
 the_question_of_succession_desc: "There Is The Ongoing Succession Problem Between Alfonsos Family.\nThe 1st Is John King Alfonsos Brother And The 2nd Is Ferdinand King Alfonsos Eldest Son.\nThe Problem Is That Ferdinand Is A Illigitimate Child And King Alfonso Heavily Favors Him.\nBut Since He Is Illegitimate That Makes His Brother John The Heir To The Throne So We Must Figure Out A Solution.\nBefore King Alfonso V Dies."
