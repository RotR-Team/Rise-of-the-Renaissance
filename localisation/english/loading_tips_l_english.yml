 LOADING_TIP_0: "Either I conquer Constantinople, or Constantinople conquers me.\n- Mehmed II"
 LOADING_TIP_1: "I Do Not Fear The Soldiers, For My Road Is Made Open To Me. And If The soldiers Come, I Have God, My Lord, Who Will Know How To Clear The Route... It Was For This That I Was Born!\n- Joan Of Arc"
 LOADING_TIP_2: "The City Is Fallen And I Am Still Alive.\n- Constantine XI Before Charging Into Battle"
 LOADING_TIP_3: "A man's greatest joy is crushing his enemies.\n- Genghis Khan"
 LOADING_TIP_4: "It is better to be at the right place with ten men than absent with ten thousand.\n- Timur The Lame"
 LOADING_TIP_5: "Marmoream relinquo, quam latericiam accepi.\n- Augustus Caesar"
 LOADING_TIP_6: "Veni, vidi, vici.\n- Julius Caesar"
 LOADING_TIP_7: "To be, or not to be, that is the question.\n- William Shakespeare"
 LOADING_TIP_8: "I do not boast about anything nor do I think about any pride, for I perform my royal duty and don't do anything above my power.\n- Ivan IV"
 LOADING_TIP_9: "I Am The State.\n- Louis XIV"
