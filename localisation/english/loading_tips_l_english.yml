l_english:
 LOADING_TIP_0: "Either I conquer Constantinople, or Constantinople conquers me.\n- Mehmed II"
 LOADING_TIP_1: "I Do Not Fear The Soldiers, For My Road Is Made Open To Me. And If The soldiers Come, I Have God, My Lord, Who Will Know How To Clear The Route... It Was For This That I Was Born!\n- Joan Of Arc"
 LOADING_TIP_2: "The City Is Fallen And I Am Still Alive.\n- Constantine XI Before Charging Into Battle"
