 GRAIN_TOOLTIP: "§YGrain§!\nGrain represents the vegetable foodstuff that was the staple diet for humans and animals. Lack of it would always lead to revolts and riots. Other cereals and vegetable foodstuffs would later be augmented."
 SUGAR_TOOLTIP: "§YSugar§!\nSugar was used not only as a sweetener but also for food preservation. The sugar cane was the only known means of obtaining sugar at this time and had been grown initially in some Mediterranean islands."