 rise_of_the_renaissance_1_ARA_history:0 "Aragon Is In A Golden Age Under Alfonso V In 1442 He Became The Saviour Of Naples.\nAnd Is Now In Union With Aragon And King Alfonso V is At The Height Of Popularity.\nBut There Is The Problem With Succession Between His Sons John And Ferdinand.\nAnd If This Isnt Settles Then The Dynasty King Alfonso V Built Will Surely Fall Apart."
 rise_of_the_renaissance_1_BYZ_history:0 "The Once Mighty Roan Empire Has Been Reduced To Just The Old Capital And Some Holdings In Greece.\nThe Previos Emperor John VIII Had Tried To Retake Our Former Land From The Ottomans But Failed Miserably.\nAnd Now Our New Emperor Constantine XI Has To Fix Our Terrible Economy And Our Destroyed Millitary.\nBut Emperor Constantine Has Hope And He Is Popular Among The Citizens Of Our Crumbiling Empire.\nSo As Long As Constantine XI Emperor Of The Roman Empire Is Alive We Shall Never Give Up. "
 rise_of_the_renaissance_1_CST_history:0 "The Kingdom Of Castille Has Been On A Rise To Power Over The Last Few Centuries\nAnd From The Succsessful Reconquista Only The Emirate Of Granda Is Left Before The Muslims Are Out Of Iberia\nAnd With Closer Ties With Our Neighboring Kingdom Of Aragon Maybe Disscusions Of A Future Union Could Start."
 rise_of_the_renaissance_1_EMG_history:0 "The Emirate Of Granada Is In Disaster With A Power S Between Our Current Sultan Muhammad IX And Muhammad X\nAnd "
 rise_of_the_renaissance_1_ENG_history:0 "England Is On The Brink Of Internal Collapse Between The House Of Lancaster And The House Of York.\nOn Whether To Continue The War With France Or Not And Also For Power And York Maybe Want To be King Himself.\nAnd Henry Wanting to Prevent That Sent Him To Ireland But This Power Struggle Could Mean Cival War."
 rise_of_the_renaissance_1_MEG_history:0 "Mamluk Egypt A Proud Islamic Nation That Had Drived The Christians Out Of The Holy Land And Now Are The Leaders Of Islam And Sultan Jaqmaq Leads Our Sultanate But To The North Sits Another Islamic State The Ottomans And They May Want To Take Our Land And Make Us Slaves Once Again."
 rise_of_the_renaissance_1_MNG_history:0 "A nation ready to shape history."
 rise_of_the_renaissance_1_OTO_history:0 "The Ottoman Empire Is The Strongest Islamic Power In The World Having Defeated The Roman Empire And The Christian Powers We Are Unstopable But To Our South Lies A Rival Islamic Power The Slave Ruled Mamluks And If We Were To Conquer Them Then Our Sultan Murad II Could Declare Himself Caliph And Become The Leader Of Islam But 1st We Must Destroy The Remanants Of The Old Roman Empire."
 rise_of_the_renaissance_1_PAP_history:0 "The Papal Staes Lead The Holy Catholic Church Under His Holiness Pope Nicholas V.\\nAnd The Eastern Orthdox Church Is On Its Knees Which Would Be Good For Us If It Wasnt For The Muslim Ottomans.\\nThey Are Preparing To Take Constantinople From The Dying Byzantine Empire So The Pope May Want To Help Our Fellow Christians From The Islamic Threat."
 rise_of_the_renaissance_1_POP_history:0 "The Papal Staes Lead The Holy Catholic Church Under His Holiness Pope Nicholas V.\nAnd The Eastern Orthdox Church Is On Its Knees Which Would Be Good For Us If It Wasnt For The Muslim Ottomans.\nThey Are Preparing To Take Constantinople From The Dying Byzantine Empire So The Pope May Want To Help Our Fellow Christians From The Islamic Threat."
 rise_of_the_renaissance_1_SCO_history:0 "Scotland Has Been Battleing Their Rivals England For Generations And Now That They Are Weakened Maybe Now We Can Strike Them And Unify The Island Under Scottish Rule."
 rise_of_the_renaissance_1_TTO_history:0 "The Teutonic Order Founded In 1190 Originaly As A Medical Orginasation After The 3rd Crusade In Acre.\nThey Were Expelled From The Holy Land And Secured Lands In Easter Europe But Not The Order Is Falling Apart.\nAs The Poles And Lithuanians Prepare To Strike Our Grand Master Ludwig Von Erlichshausen Is Currently Trying To Heal The Order."
 rise_of_the_renaissance_1_desc:0 "The Year Is 1450 And Europe Is Not Well In The West The Reconquista Continues And England Is Facing Internal Strife While Continueing The 100 Years War With France.\nIn Central Europe The Renaissance Is About To Enter A Golden Age As Literature And Art Continues Continues To Evolve But The Holy Roman Empire And The Hapsburg Realm May Face A New Islamic Enemy.\nIn The East The Once Mighty Roman Empire Is Shattered And Broken After The 4th Crusade And Now All That Is Left Is Constantinople The City Is A Shell Of Its Former Self.\nMeanwhile The Fast Growing Ottoman Empire Has Conquered The Former Byzantine Lands And The Balkans And Mehmed II Ambitions May End The Byzantine Empire Once And For All."
